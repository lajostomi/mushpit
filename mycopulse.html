<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MycoPulse</title>
<style>
  :root { --bg:#0e1512; --fg:#d7efe3; --mut:#7fa592; --acc:#3ddc97; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; }
  p { margin:0 0 12px; color:var(--mut); }
  .bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
  button { background:var(--acc); color:#04140c; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .meter { flex:1 1 200px; height:10px; background:#1d2a24; border-radius:5px; overflow:hidden; }
  .meter > i { display:block; height:100%; width:50%; background:var(--acc); transition:width .1s; }
  /* Strudel injects a full-screen visualiser canvas; keep it behind our UI */
  #test-canvas { z-index:-1 !important; pointer-events:none; }
  button.alt { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  .range { font-size:13px; color:var(--mut); }
  .range input[type=number] { width:80px; background:#1d2a24; color:var(--fg); border:1px solid #2c3d35; border-radius:4px; padding:3px 6px; }
  .read { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; margin-bottom:8px; }
  .read b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .read small { color:var(--mut); }
  canvas { width:100%; height:180px; background:#0a100d; border-radius:6px; margin-bottom:12px; }
  #status { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<h1>MycoPulse</h1>
<p>Mycelium resistance → Strudel choir. Press Connect for the Arduino, or just play the editor (simulated signal).</p>
<div class="bar">
  <button id="play">▶ Play</button>
  <button id="stop" class="alt">■ Stop</button>
  <button id="connect" class="alt">Connect Arduino</button>
  <span id="status">simulated signal</span>
</div>
<div class="bar range">
  <label><input type="checkbox" id="auto"> auto range</label>
  <label>low <input type="number" id="rmin" value="5000" step="500"> Ω</label>
  <label>high <input type="number" id="rmax" value="20000" step="500"> Ω</label>
  <small>The music follows where the resistance sits between low and high. Set them to your substrate's dry and wet values.</small>
</div>
<div class="read">
  <div><b id="ohms">–</b><small>ohms</small></div>
  <div><b id="lvlpct">–</b><small>level</small></div>
  <div><b id="actpct">–</b><small>activity</small></div>
  <div class="meter" title="resistance level"><i id="lvl"></i></div>
</div>
<canvas id="chart" width="900" height="180"></canvas>

<!-- AGPL-3.0: if you publish this page, publish its source under a compatible licence too. -->
<script src="https://unpkg.com/@strudel/repl@latest"></script>
<strudel-editor>
<!--
setcps(0.35)
const lvl = signal(() => globalThis.myco.v)
const act = signal(() => globalThis.myco.d)
// resistance level (0..1) decides pitch, brightness AND which voices sing:
//   low resistance  -> deep oohs, dark;  mid -> choir;  high -> solo voice joins, bright
const band = (lo, hi) => lvl.segment(8).fmap((v) => (v >= lo && v < hi ? 1 : 0))
stack(
  n(lvl.segment(4).range(0, 10)).scale('D4:minor:pentatonic')
    .s('gm_choir_aahs').attack(0.15).release(0.8)
    .lpf(lvl.range(800, 7000)).room(0.8).gain(band(0.25, 1.01).mul(0.8)),
  n(lvl.segment(1).range(0, 6)).scale('D3:minor:pentatonic')
    .s('gm_voice_oohs').attack(0.4).release(1.5).room(0.9).gain(band(0, 0.6).mul(0.8)),
  n(lvl.segment(8).range(0, 12)).scale('D4:minor:pentatonic')
    .s('gm_lead_6_voice').gain(band(0.6, 1.01).mul(0.6))
    .room(0.6).delay(0.3),
  s('gm_breath_noise').n(lvl.segment(1).range(0, 7).floor()).slow(2)
    .gain(act.range(0.1, 0.6)).hpf(500).room(0.6).pan(sine.slow(7))
)
-->
</strudel-editor>

<script>
// the component sometimes initialises before the comment is parsed: fill the editor ourselves
addEventListener('load', () => {
  const el = document.querySelector('strudel-editor');
  const c = [...el.childNodes].find((n) => n.nodeType === 8);
  if (c && el.editor && !el.editor.code) el.editor.setCode(c.textContent.trim());
});

// ───── data bridge: Arduino (Web Serial) or simulation → globalThis.myco ─────
const myco = (globalThis.myco = { v: 0.5, d: 0, raw: 0, min: NaN, max: NaN, live: false });
const parseLine = (line) => parseFloat(line.trim().split(',').pop()); // last CSV field = ohms

function feed(raw) {
  if (!isFinite(raw)) return;
  myco.min = isNaN(myco.min) ? raw : Math.min(myco.min + (raw - myco.min) * 0.0005, raw);
  myco.max = isNaN(myco.max) ? raw : Math.max(myco.max + (raw - myco.max) * 0.0005, raw);
  const auto = document.getElementById('auto').checked;
  const lo = auto ? myco.min : +document.getElementById('rmin').value;
  const hi = auto ? myco.max : +document.getElementById('rmax').value;
  const v = Math.min(1, Math.max(0, (raw - lo) / Math.max(hi - lo, 1e-6)));
  const prev = myco.v;
  myco.v = prev + (v - prev) * 0.15;
  myco.d = Math.min(1, myco.d * 0.9 + Math.abs(v - prev) * 8);
  myco.raw = raw;
  document.getElementById('lvl').style.width = (myco.v * 100).toFixed(0) + '%';
  document.getElementById('ohms').textContent = raw >= 1000 ? (raw / 1000).toFixed(2) + ' k' : raw.toFixed(0);
  document.getElementById('lvlpct').textContent = (myco.v * 100).toFixed(0) + '%';
  document.getElementById('actpct').textContent = (myco.d * 100).toFixed(0) + '%';
  series.push(raw);
  if (series.length > MAXPTS) series.shift();
  drawChart();
}

// ───── live chart of the raw resistance ─────
const series = [], MAXPTS = 600;
const cv = document.getElementById('chart'), cx = cv.getContext('2d');
function drawChart() {
  const w = cv.width, h = cv.height;
  cx.clearRect(0, 0, w, h);
  if (series.length < 2) return;
  const lo = Math.min(...series), hi = Math.max(...series), span = Math.max(hi - lo, 1);
  cx.strokeStyle = '#3ddc97'; cx.lineWidth = 2; cx.beginPath();
  series.forEach((r, i) => {
    const x = (i / (MAXPTS - 1)) * w, y = h - 14 - ((r - lo) / span) * (h - 28);
    i ? cx.lineTo(x, y) : cx.moveTo(x, y);
  });
  cx.stroke();
  cx.fillStyle = '#7fa592'; cx.font = '12px system-ui';
  cx.fillText(hi.toFixed(0) + ' Ω', 6, 12);
  cx.fillText(lo.toFixed(0) + ' Ω', 6, h - 3);
}

// ───── play / stop the Strudel code ─────
const ed = () => document.querySelector('strudel-editor').editor;
document.getElementById('play').onclick = () => ed().evaluate();
document.getElementById('stop').onclick = () => ed().stop();

let t = 0;
setInterval(() => {
  if (myco.live) return;
  t += 0.05;
  feed(10000 + 2500 * Math.sin(t * 0.3) + 800 * Math.sin(t * 1.7) + (Math.random() - 0.5) * 300);
}, 100);

document.getElementById('connect').onclick = async () => {
  const status = document.getElementById('status');
  if (!('serial' in navigator)) { status.textContent = 'Web Serial needs Chrome or Edge'; return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    myco.live = true;
    status.textContent = 'live: Arduino connected';
    const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n');
      buf = lines.pop();
      lines.forEach((l) => feed(parseLine(l)));
    }
  } catch (e) {
    status.textContent = 'serial error: ' + e.message;
  }
  myco.live = false;
  status.textContent = 'simulated signal';
};
</script>
</body>
</html>
